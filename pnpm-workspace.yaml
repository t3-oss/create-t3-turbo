packages:
  - apps/*
  - packages/*
  - tooling/*

# pnpm 11 replaced `onlyBuiltDependencies` with `allowBuilds`, and pnpm 12
# fails the install while an entry is still undecided.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  "@prisma/client": false
  "@prisma/engines": false
  better-sqlite3: false
  bufferutil: false
  core-js-pure: false
  prisma: false
  sharp: false
  utf-8-validate: false

catalog:
  "@better-auth/cli": 1.4.0-beta.9
  "@better-auth/expo": 1.4.0-beta.9
  "@eslint/js": ^9.38.0
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-form": ^1.27.1
  "@tanstack/react-query": ^5.103.1
  "@trpc/client": ^11.19.0
  "@trpc/server": ^11.19.0
  "@trpc/tanstack-react-query": ^11.19.0
  "@types/node": ^24.13.6
  "@vitejs/plugin-react": 5.1.0
  better-auth: 1.4.0-beta.9
  eslint: ^9.38.0
  prettier: ^3.6.2
  tailwindcss: ^4.3.3
  typescript: ^5.9.3
  zod: ^4.6.5
  vite: 7.1.12

catalogs:
  react19:
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    react: 19.3.0
    react-dom: 19.3.0

linkWorkspacePackages: true

overrides:
  "@types/minimatch": 5.1.2
  vite: 7.1.12

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
